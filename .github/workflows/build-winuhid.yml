name: Build WinUHid Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout WinUHid
        uses: actions/checkout@v4
        with:
          repository: cgutman/WinUHid
          path: WinUHid

      - name: Install Windows Driver Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe' -OutFile $setup
          $p = Start-Process $setup -ArgumentList '/quiet','/features','+','/norestart' -Wait -PassThru
          Write-Host "wdksetup exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "wdksetup failed: $($p.ExitCode)" }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\wdf' -Recurse -Filter wdf.h | Select-Object -First 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build WinUHid driver
        working-directory: WinUHid
        run: msbuild "WinUHid Driver\WinUHid Driver.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="${{ github.workspace }}\WinUHid\" /m /verbosity:minimal

      - name: Build WinUHid user library
        working-directory: WinUHid
        run: msbuild "WinUHid\WinUHid.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="${{ github.workspace }}\WinUHid\" /m /verbosity:minimal

      - name: Upload WinUHid driver and library
        uses: actions/upload-artifact@v4
        with:
          name: WinUHidDriver-x64-Release
          path: |
            WinUHid/build/Release/x64/**
            WinUHid/WinUHid/WinUHid.h
          if-no-files-found: error
