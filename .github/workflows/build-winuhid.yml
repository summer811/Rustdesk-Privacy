name: Build WinUHid Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout WinUHid
        uses: actions/checkout@v4
        with:
          repository: cgutman/WinUHid
          path: WinUHid

      - name: Install Windows Driver Kit 22621 with VS integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'wdksetup-22621.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/7/b/f/7bfc8dbe-00cb-47de-b856-70e696ef4f46/wdk/wdksetup.exe' -OutFile $setup
          $p = Start-Process $setup -ArgumentList '/quiet','/features','+','/norestart' -Wait -PassThru
          Write-Host "wdksetup exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "wdksetup failed: $($p.ExitCode)" }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\wdf' -Recurse -Filter wdf.h | Select-Object -First 1
          $tasks = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\build\10.0.22621.0\bin' -Filter 'Microsoft.DriverKit.Build.Tasks*' -ErrorAction SilentlyContinue
          $tasks | Select-Object Name,Length
          if (-not $tasks) { throw 'DriverKit build tasks missing after WDK install' }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build WinUHid driver
        working-directory: WinUHid
        run: msbuild "WinUHid Driver\WinUHid Driver.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0 /p:SolutionDir="${{ github.workspace }}\WinUHid\" /m /verbosity:minimal

      - name: Build WinUHid user library
        working-directory: WinUHid
        run: msbuild "WinUHid\WinUHid.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0 /p:SolutionDir="${{ github.workspace }}\WinUHid\" /m /verbosity:minimal

      - name: Upload WinUHid driver and library
        uses: actions/upload-artifact@v4
        with:
          name: WinUHidDriver-x64-Release
          path: |
            WinUHid/build/Release/x64/**
            WinUHid/WinUHid/WinUHid.h
          if-no-files-found: error
